[project]
name = "ai-workbench"
version = "0.1.0"
description = "Log triage agent on Nemotron and Nebius Token Factory: runbook-grounded diagnosis with human approval before any fix"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.1",
    "openai>=3.31.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-workbench = "ai_workbench:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
